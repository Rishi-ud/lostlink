<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="airpodWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)"/>
  <circle cx="200" cy="140" r="95" fill="#38BDF8" opacity="0.08"/>
  <!-- Case Body -->
  <rect x="125" y="85" width="150" height="110" rx="38" fill="url(#airpodWhite)" filter="url(#shadow5)"/>
  <!-- Lid Seam Line -->
  <line x1="125" y1="120" x2="275" y2="120" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Status LED -->
  <circle cx="200" cy="140" r="3" fill="#22C55E"/>
  <!-- Lightning / USB-C Port -->
  <rect x="188" y="191" width="24" height="4" rx="2" fill="#94A3B8"/>
  <!-- Subtle Earbud icon peek -->
  <path d="M 180 65 Q 185 55 195 55 Q 200 65 195 75 Z" fill="#E2E8F0" opacity="0.7"/>
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">AIRPODS PRO (2ND GEN)</text>
</svg>