<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)"/>
  <!-- Lanyard clip -->
  <rect x="188" y="35" width="24" height="25" rx="4" fill="#94A3B8"/>
  <circle cx="200" cy="48" r="5" fill="#0F172A"/>
  <!-- ID Card Body -->
  <rect x="95" y="55" width="210" height="145" rx="12" fill="url(#cardBg)" filter="url(#shadow6)"/>
  <!-- SRM Header banner -->
  <rect x="95" y="55" width="210" height="38" rx="12" fill="#1D4ED8"/>
  <rect x="95" y="80" width="210" height="13" fill="#1D4ED8"/>
  <text x="200" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">SRM UNIVERSITY</text>
  <!-- Photo box -->
  <rect x="110" y="105" width="55" height="65" rx="6" fill="#CBD5E1"/>
  <circle cx="137" cy="128" r="14" fill="#94A3B8"/>
  <path d="M 120 162 C 120 148 155 148 155 162 Z" fill="#94A3B8"/>
  <!-- Lines of text -->
  <rect x="175" y="112" width="115" height="10" rx="3" fill="#1E293B"/>
  <rect x="175" y="128" width="90" height="8" rx="2" fill="#64748B"/>
  <rect x="175" y="142" width="75" height="8" rx="2" fill="#64748B"/>
  <rect x="175" y="156" width="105" height="7" rx="2" fill="#3B82F6"/>
  <!-- Barcode -->
  <rect x="110" y="180" width="180" height="12" rx="2" fill="#0F172A"/>
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#93C5FD" letter-spacing="1">SRM STUDENT ID CARD</text>
</svg>