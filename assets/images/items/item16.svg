<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="watchBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow16" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg16)"/>
  <!-- Brown Leather Straps -->
  <g filter="url(#shadow16)">
    <rect x="182" y="35" width="36" height="70" rx="4" fill="url(#leatherStrap)"/>
    <line x1="186" y1="35" x2="186" y2="105" stroke="#D97706" stroke-dasharray="3,3" stroke-width="1"/>
    <line x1="214" y1="35" x2="214" y2="105" stroke="#D97706" stroke-dasharray="3,3" stroke-width="1"/>
    <rect x="182" y="175" width="36" height="70" rx="4" fill="url(#leatherStrap)"/>
    <line x1="186" y1="175" x2="186" y2="245" stroke="#D97706" stroke-dasharray="3,3" stroke-width="1"/>
    <line x1="214" y1="175" x2="214" y2="245" stroke="#D97706" stroke-dasharray="3,3" stroke-width="1"/>
    <!-- Watch Case / Dial -->
    <circle cx="200" cy="140" r="48" fill="url(#watchBezel)"/>
    <circle cx="200" cy="140" r="42" fill="#0F172A"/>
    <!-- Crown -->
    <rect x="248" y="136" width="6" height="8" rx="2" fill="url(#watchBezel)"/>
    <!-- Dial Markers -->
    <line x1="200" y1="102" x2="200" y2="110" stroke="#FFF" stroke-width="2.5"/>
    <line x1="200" y1="170" x2="200" y2="178" stroke="#FFF" stroke-width="2.5"/>
    <line x1="162" y1="140" x2="170" y2="140" stroke="#FFF" stroke-width="2.5"/>
    <line x1="230" y1="140" x2="238" y2="140" stroke="#FFF" stroke-width="2.5"/>
    <!-- Brand -->
    <text x="200" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#E2E8F0" letter-spacing="1">FOSSIL</text>
    <!-- Hands (pointing to 10:10) -->
    <line x1="200" y1="140" x2="184" y2="120" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="222" y2="125" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="195" y2="162" stroke="#DC2626" stroke-width="1" stroke-linecap="round"/>
    <circle cx="200" cy="140" r="3" fill="#DC2626"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#D6D3D1" letter-spacing="1">FOSSIL ANALOG WATCH</text>
</svg>