<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg12)"/>
  <!-- Velvet display pad -->
  <rect x="90" y="60" width="220" height="160" rx="16" fill="#27272A" stroke="#3F3F46" stroke-width="1" filter="url(#shadow12)"/>
  <!-- Gold Chain Oval links -->
  <ellipse cx="200" cy="140" rx="75" ry="45" fill="none" stroke="url(#gold1)" stroke-width="6" stroke-dasharray="14,4" filter="url(#shadow12)"/>
  <!-- Little pendant heart charm -->
  <g transform="translate(195, 180)" filter="url(#shadow12)">
    <path d="M 5 5 C 5 -2 -4 -2 -4 5 C -4 10 5 16 5 16 C 5 16 14 10 14 5 C 14 -2 5 -2 5 5 Z" fill="url(#gold1)"/>
  </g>
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FDE68A" letter-spacing="1">GOLD CHAIN BRACELET</text>
</svg>