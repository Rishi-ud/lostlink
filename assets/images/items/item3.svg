<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#11111B"/>
    </linearGradient>
    <linearGradient id="macScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="spaceGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <!-- Laptop Display (Open) -->
  <g filter="url(#shadow3)">
    <rect x="95" y="55" width="210" height="135" rx="10" fill="#1F2937" stroke="#4B5563" stroke-width="2"/>
    <rect x="105" y="65" width="190" height="115" rx="4" fill="url(#macScreen)"/>
    <!-- Screen wallpaper graphics -->
    <circle cx="200" cy="120" r="35" fill="#FFF" opacity="0.25"/>
    <!-- Webcam notch -->
    <rect x="188" y="65" width="24" height="6" rx="3" fill="#1F2937"/>
    <circle cx="200" cy="68" r="1.5" fill="#10B981"/>
    <!-- Base / Keyboard deck -->
    <polygon points="65,215 335,215 315,190 85,190" fill="url(#spaceGray)"/>
    <rect x="80" y="213" width="240" height="7" rx="3.5" fill="#1F2937"/>
    <rect x="175" y="213" width="50" height="3" rx="1.5" fill="#9CA3AF"/>
    <!-- Trackpad area -->
    <rect x="165" y="202" width="70" height="10" rx="2" fill="#374151" stroke="#4B5563" stroke-width="0.5"/>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC" letter-spacing="1">MACBOOK AIR M2 · SPACE GRAY</text>
</svg>