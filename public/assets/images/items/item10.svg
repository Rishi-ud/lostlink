<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="pufferRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg10)"/>
  <!-- Jacket Silhouette -->
  <g filter="url(#shadow10)">
    <!-- Collar -->
    <path d="M 160 70 Q 200 80 240 70 L 250 95 Q 200 105 150 95 Z" fill="#991B1B"/>
    <!-- Sleeves -->
    <path d="M 140 85 L 85 140 L 110 165 L 145 130 Z" fill="url(#pufferRed)"/>
    <path d="M 260 85 L 315 140 L 290 165 L 255 130 Z" fill="url(#pufferRed)"/>
    <!-- Main Body Quilting -->
    <rect x="140" y="90" width="120" height="135" rx="14" fill="url(#pufferRed)"/>
    <!-- Quilted horizontal segments -->
    <line x1="140" y1="120" x2="260" y2="120" stroke="#991B1B" stroke-width="3"/>
    <line x1="140" y1="150" x2="260" y2="150" stroke="#991B1B" stroke-width="3"/>
    <line x1="140" y1="180" x2="260" y2="180" stroke="#991B1B" stroke-width="3"/>
    <line x1="140" y1="210" x2="260" y2="210" stroke="#991B1B" stroke-width="3"/>
    <!-- Front Zipper -->
    <line x1="200" y1="75" x2="200" y2="225" stroke="#1E293B" stroke-width="4"/>
    <rect x="196" y="105" width="8" height="12" rx="2" fill="#E2E8F0"/>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FCA5A5" letter-spacing="1">RED UNIQLO PUFFER JACKET</text>
</svg>