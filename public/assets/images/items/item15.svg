<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg15)"/>
  <circle cx="200" cy="140" r="95" fill="#38BDF8" opacity="0.08"/>
  <g filter="url(#shadow15)">
    <!-- Cap Loop -->
    <path d="M 185 55 C 185 40 215 40 215 55" stroke="#334155" stroke-width="6" fill="none"/>
    <!-- Bottle Cap -->
    <rect x="178" y="55" width="44" height="22" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Neck -->
    <rect x="183" y="77" width="34" height="15" fill="url(#steelGrad)"/>
    <!-- Main Bottle Body -->
    <rect x="165" y="92" width="70" height="135" rx="12" fill="url(#steelGrad)"/>
    <!-- Specular highlight streak -->
    <line x1="180" y1="95" x2="180" y2="222" stroke="#FFF" stroke-width="3" opacity="0.8"/>
    <!-- Bottom dent mark mentioned in description -->
    <path d="M 215 215 Q 225 218 220 225" stroke="#475569" stroke-width="2" fill="none"/>
  </g>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">STEEL WATER BOTTLE (750ML)</text>
</svg>