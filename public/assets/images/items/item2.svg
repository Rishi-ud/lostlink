<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="silver1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="carabiner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <circle cx="200" cy="150" r="105" fill="#2563EB" opacity="0.08"/>
  <!-- Blue Carabiner -->
  <rect x="145" y="55" width="110" height="75" rx="30" fill="none" stroke="url(#carabiner)" stroke-width="14" filter="url(#shadow2)"/>
  <rect x="235" y="70" width="12" height="40" rx="3" fill="#93C5FD"/>
  <!-- Key ring -->
  <circle cx="200" cy="140" r="32" fill="none" stroke="url(#silver1)" stroke-width="7" filter="url(#shadow2)"/>
  <!-- Key 1 (center) -->
  <g transform="translate(185, 155)" filter="url(#shadow2)">
    <circle cx="15" cy="15" r="16" fill="url(#silver1)"/>
    <circle cx="15" cy="15" r="7" fill="#0F172A"/>
    <rect x="11" y="28" width="8" height="65" fill="url(#silver1)"/>
    <rect x="19" y="65" width="8" height="6" fill="url(#silver1)"/>
    <rect x="19" y="77" width="11" height="6" fill="url(#silver1)"/>
    <rect x="19" y="87" width="6" height="5" fill="url(#silver1)"/>
  </g>
  <!-- Key 2 (slanted left) -->
  <g transform="translate(155, 145) rotate(22 20 20)" filter="url(#shadow2)">
    <polygon points="20,0 35,18 28,38 12,38 5,18" fill="url(#silver1)"/>
    <circle cx="20" cy="18" r="6" fill="#0F172A"/>
    <rect x="16" y="38" width="8" height="58" fill="url(#silver1)"/>
    <rect x="8" y="70" width="8" height="5" fill="url(#silver1)"/>
    <rect x="8" y="82" width="12" height="6" fill="url(#silver1)"/>
  </g>
  <text x="200" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">SILVER KEYS & CARABINER</text>
</svg>